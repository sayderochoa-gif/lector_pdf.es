services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lector_pdf_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/backend/storage
    environment:
      - DEBUG=false
      - MAX_UPLOAD_SIZE=104857600
      - TESSERACT_LANG=spa+eng
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: lector_pdf_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
